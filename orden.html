<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orden de trazos — Eazi Hanzi</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/trazos.css">
<link rel="stylesheet" href="css/orden.css">
</head>
<body data-page="orden">

<header class="site-header">
  <div class="container site-header__inner">
    <a href="index.html" class="brand">
      <img src="assets/logo.svg" alt="Mascota Eazi Hanzi" class="brand__logo">
      <span class="brand__name">Eazi Hanzi</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Inicio</a>
    </nav>
  </div>
</header>

<div class="app-shell">
<aside class="mode-sidebar" id="mode-sidebar"></aside>

<main>
  <section class="section">
    <div class="container">
      <h1>Orden de trazos</h1>
      <p class="text-muted">Escribe cualquier carácter o palabra en chino y mira cómo se escribe, trazo por trazo.</p>

      <div class="card od-search">
        <label class="od-search__label" for="od-input">Caracteres en chino</label>
        <input type="text" id="od-input" class="od-search__input" autocomplete="off" spellcheck="false" placeholder="你好">
        <p class="od-search__note" id="od-note" hidden></p>
      </div>

      <div class="od-result" id="od-result" hidden>
        <div class="od-pinyin" id="od-pinyin"></div>

        <div class="tz-controls">
          <button class="btn-seal" id="od-reset" title="Reiniciar" aria-label="Reiniciar">&#8635;</button>
          <button class="btn-seal" id="od-audio" title="Escuchar pronunciación" aria-label="Escuchar pronunciación">&#128266;</button>
          <button class="btn-seal" id="od-play" title="Reproducir / pausar" aria-label="Reproducir / pausar">&#9654;</button>
          <div class="tz-speed">
            <label for="od-speed">Velocidad</label>
            <input type="range" id="od-speed" min="0.25" max="3" step="0.25" value="1">
            <output class="tz-speed__value" id="od-speed-value" for="od-speed">1x</output>
          </div>
        </div>

        <div class="od-boards" id="od-boards"></div>
        <p class="od-hint">Pasa el mouse por encima de un carácter para ver su orden de trazos (en el celular, tócalo).</p>
      </div>
    </div>
  </section>
</main>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.0/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<script src="js/pinyin-tones.js"></script>
<script src="js/storage.js"></script>
<script src="js/speech.js"></script>
<script src="js/site-footer.js"></script>
<script src="js/mode-sidebar.js"></script>
<script src="js/hanzi-boards.js"></script>
<script src="js/orden.js"></script>

</body>
</html>
